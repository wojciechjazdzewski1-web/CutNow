{% from "_panel_icons.html" import icon %}
<nav class="glo-subnav mb-6 flex gap-1.5 overflow-x-auto p-1.5 rounded-2xl bg-slate-100/80 border border-slate-200/60 dark:bg-slate-800/50 dark:border-slate-700" aria-label="Sekcje klientów">
