{% if wywiad_przy_rezerwacji and tresc_wywiadu %}
  <div class="client-soft-panel rounded-xl border p-4 space-y-4">
    <h2 class="text-sm font-semibold client-heading">Oświadczenie zdrowotne</h2>
    <p class="text-xs client-muted">Przeczytaj uważnie treść przygotowaną przez {{ dane.nazwa_salonu }}. Nie musisz odpowiadać na pytania — wystarczy akceptacja.</p>

    <div class="max-h-64 overflow-y-auto rounded-xl border border-brand-200/80 dark:border-brand-700 bg-white/80 dark:bg-black/20 p-4 text-sm client-heading leading-relaxed whitespace-pre-wrap">{{ tresc_wywiadu }}</div>

    <label class="flex items-start gap-3 cursor-pointer">
      <input type="checkbox" name="przeczytalem_wywiad" value="on" required class="mt-1 h-4 w-4 rounded text-brand-600 focus:ring-brand-500">
      <span class="text-sm client-muted leading-relaxed">
        Potwierdzam, że <strong class="client-heading">przeczytałem/am</strong> powyższe oświadczenie zdrowotne i akceptuję jego treść w związku z moją wizytą.
      </span>
    </label>

    <label class="flex items-start gap-3 cursor-pointer">
      <input type="checkbox" name="zgoda_wywiad" value="on" required class="mt-1 h-4 w-4 rounded text-brand-600 focus:ring-brand-500">
      <span class="text-xs client-muted leading-relaxed">
        Wyrażam zgodę na przetwarzanie danych zdrowotnych (w zakresie tego oświadczenia) przez
        <strong class="client-heading">{{ dane.nazwa_salonu }}</strong> na potrzeby bezpiecznego wykonania usługi.
      </span>
    </label>
  </div>
{% endif %}
