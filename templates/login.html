{% extends "base.html" %}
{% block title %}Logowanie — CutNow{% endblock %}

{% block content %}
<div class="max-w-sm mx-auto">
  <h1 class="text-2xl font-bold text-slate-900 mb-2 text-center">Panel salonu</h1>
  <p class="text-slate-600 text-sm text-center mb-8">Wpisz hasło właściciela, aby zarządzać salonem.</p>

  <form method="post" class="rounded-2xl bg-white border border-slate-200 p-6 shadow-sm space-y-5">
    <input type="hidden" name="next" value="{{ request.args.get('next', '') }}">
    <div>
      <label for="haslo" class="block text-sm font-medium text-slate-700 mb-2">Hasło</label>
      <input type="password" id="haslo" name="haslo" required autofocus
        class="w-full rounded-xl border border-slate-300 px-4 py-3 focus:ring-2 focus:ring-brand-500 outline-none"
        placeholder="Twoje hasło panelu">
    </div>
    <button type="submit" class="w-full rounded-xl bg-brand-600 hover:bg-brand-700 text-white font-semibold py-3 transition-colors">
      Zaloguj się
    </button>
  </form>

  <p class="text-center text-sm text-slate-500 mt-6">
    <a href="{{ url_for('podglad_klienta') }}" class="text-brand-600 hover:underline">Strona terminów dla klientów</a>
  </p>
</div>
{% endblock %}
