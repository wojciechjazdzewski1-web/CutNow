{% extends "base.html" %}
{% block title %}Potwierdź rezerwację — {{ dane.nazwa_salonu }}{% endblock %}

{% block content %}
<div class="max-w-md mx-auto">
  <a href="{{ url_for('rezerwacja_publiczna', data=wybrana_data) }}" class="inline-flex items-center gap-1 text-sm text-slate-500 hover:text-brand-600 mb-6">
    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>
    Wróć do terminów
  </a>

  <h1 class="text-2xl font-bold text-slate-900 mb-2">Twoja rezerwacja</h1>
  <p class="text-slate-600 mb-6">
    <span class="font-semibold text-slate-800">{{ dane.nazwa_salonu }}</span><br>
    {{ dni_tygodnia[dzien_tygodnia] }}, {{ wybrana_data }} o <span class="text-brand-700 font-bold">{{ godzina }}</span>
  </p>

  <form method="post" class="rounded-2xl bg-white border border-slate-200 p-6 shadow-sm space-y-5">
    <input type="hidden" name="data" value="{{ wybrana_data }}">
    <input type="hidden" name="godzina" value="{{ godzina }}">

    <div>
      <label for="imie" class="block text-sm font-medium text-slate-700 mb-2">Imię i nazwisko *</label>
      <input type="text" id="imie" name="imie" required
        class="w-full rounded-xl border border-slate-300 px-4 py-3 focus:ring-2 focus:ring-brand-500 outline-none"
        placeholder="np. Anna Kowalska">
    </div>

    <div>
      <label for="telefon" class="block text-sm font-medium text-slate-700 mb-2">Telefon *</label>
      <input type="tel" id="telefon" name="telefon" required
        class="w-full rounded-xl border border-slate-300 px-4 py-3 focus:ring-2 focus:ring-brand-500 outline-none"
        placeholder="np. 500 123 456">
    </div>

    <div>
      <label for="uwagi" class="block text-sm font-medium text-slate-700 mb-2">Uwagi (opcjonalnie)</label>
      <textarea id="uwagi" name="uwagi" rows="3"
        class="w-full rounded-xl border border-slate-300 px-4 py-3 focus:ring-2 focus:ring-brand-500 outline-none resize-none"
        placeholder="np. strzyżenie męskie"></textarea>
    </div>

    <button type="submit" class="w-full rounded-xl bg-gradient-to-r from-brand-600 to-brand-700 text-white font-semibold py-3.5 hover:from-brand-500 hover:to-brand-600 transition-all shadow-lg shadow-brand-500/25">
      Zarezerwuj wizytę
    </button>
  </form>
</div>
{% endblock %}
