# Blueprint Render — po zmianach: Deploy z repo + dodaj bazę PostgreSQL w panelu.
databases:
  - name: glovaro-db
    databaseName: glovaro
    user: glovaro
    plan: free

services:
  - type: web
    name: glovaro
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn wsgi:application --bind 0.0.0.0:$PORT --workers 1 --timeout 120
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: SECRET_KEY
        generateValue: true
      - key: PANEL_PASSWORD
        sync: false
      - key: REMINDER_SECRET
        sync: false
      - key: INSTAGRAM_BOT_API_KEY
        sync: false
      - key: FLASK_DEBUG
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: glovaro-db
          property: connectionString

  - type: web
    name: glovaro-instagram-bot
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node instagramBot.js
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: OPENAI_API_KEY
        sync: false
      - key: INSTAGRAM_VERIFY_TOKEN
        sync: false
      - key: INSTAGRAM_PAGE_ACCESS_TOKEN
        sync: false
      - key: META_APP_SECRET
        sync: false
      - key: META_GRAPH_API_VERSION
        value: "v21.0"
      - key: INSTAGRAM_BOT_API_KEY
        sync: false
      - key: INSTAGRAM_SALON_ID
        sync: false
      - key: GLOVARO_API_HOST
        fromService:
          name: glovaro
          type: web
          property: host
